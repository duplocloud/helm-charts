name: PR Title Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  validate-pr-title:
    name: Validate PR title (conventional commits)
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Valid types (must match release-please expectations)
          types: |
            feat
            fix
            chore
            docs
            refactor
            perf
            test
            ci
            build
            revert
          # Require a scope e.g. feat(aos): ...
          requireScope: false
          # Disallow uppercase first letter in the subject
          subjectPattern: ^[^A-Z].*$
          subjectPatternError: |
            The subject "{subject}" found in the PR title "{title}" must start with a lowercase letter.
            Example: feat(aos): add grafana mcp server
