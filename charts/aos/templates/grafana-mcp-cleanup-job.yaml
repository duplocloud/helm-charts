{{- if not .Values.grafanaMCP.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: grafana-mcp-cleanup
  namespace: {{ .Release.Namespace }}
  annotations:
    "helm.sh/hook": post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": hook-succeeded,before-hook-creation
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    spec:
      containers:
        - name: grafana-mcp-cleanup
          image: "{{ .Values.integrationJob.image }}:{{ .Values.integrationJob.imageTag }}"
          command:
            - /bin/sh
            - -c
            - |
              # Delete K8s secret
              kubectl delete secret grafana-mcp-server \
                --namespace="{{ .Release.Namespace }}" \
                --ignore-not-found=true \
                && echo "grafana-mcp-server secret removed (or was already absent)"

              # Delete Grafana service account (also removes all its tokens)
              SA_NAME="mcp-{{ .Release.Namespace | trimPrefix "duploservices-" }}"
              GRAFANA_URL="{{ .Values.grafanaMCP.grafanaUrl }}"

              if [ -z "${GF_ADMIN_USER}" ] || [ -z "${GF_ADMIN_PASS}" ]; then
                echo "⚠️  No Grafana credentials — skipping Grafana SA cleanup"
                exit 0
              fi

              SA_ID=$(curl -sf \
                -u "${GF_ADMIN_USER}:${GF_ADMIN_PASS}" \
                "${GRAFANA_URL}/api/serviceaccounts/search?query=${SA_NAME}" \
                | jq -r '.serviceAccounts[] | select(.name=="'"${SA_NAME}"'") | .id // empty')

              if [ -z "$SA_ID" ]; then
                echo "Grafana SA '${SA_NAME}' not found — nothing to clean up"
                exit 0
              fi

              echo "Deleting Grafana SA '${SA_NAME}' (ID: ${SA_ID}) and all its tokens..."
              curl -sf -X DELETE \
                -u "${GF_ADMIN_USER}:${GF_ADMIN_PASS}" \
                "${GRAFANA_URL}/api/serviceaccounts/${SA_ID}" \
                && echo "✅ Grafana SA '${SA_NAME}' deleted" \
                || echo "⚠️  Failed to delete Grafana SA '${SA_NAME}'"
          env:
            - name: GF_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: grafanaui
                  key: username
            - name: GF_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: grafanaui
                  key: password
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "100m"
              memory: "128Mi"
      serviceAccountName: {{ .Release.Namespace }}-edit-user
      restartPolicy: Never
{{- if .Values.grafanaMCP.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.grafanaMCP.nodeSelector | indent 8 }}
{{- end }}
{{- end }}
