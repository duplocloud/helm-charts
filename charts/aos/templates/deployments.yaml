{{- if .Values.grafanaProxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-proxy
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ .Values.grafanaProxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: grafana-proxy
  template:
    metadata:
      labels:
        app: grafana-proxy
    spec:
      containers:
        - name: grafana-proxy
          image: "{{ .Values.grafanaProxy.image }}:{{ .Values.grafanaProxy.imageTag }}"
          ports:
            - name: proxy
              containerPort: 80
              protocol: TCP
          env:
            - name: DUPLO_AUTH_URL
              value: {{ .Values.global.duploAuthUrl | quote }}
            - name: BACKEND_URL
              value: "http://grafana-ui:3000"
            - name: CUSTOM_HEADER_ADD
              value: "proxy_set_header X-WEBAUTH-USER duplocloud;"
          readinessProbe:
            httpGet:
              path: /duplo_auth
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /duplo_auth
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          resources:
{{- toYaml .Values.grafanaProxy.resources | nindent 12 }}
{{- if .Values.grafanaProxy.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.grafanaProxy.nodeSelector | indent 8 }}
{{- end }}
---
{{- end }}

{{- if .Values.pdc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: grafana-pdc-agent
    name: grafana-pdc-agent
  name: grafana-pdc-agent
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      name: grafana-pdc-agent
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        name: grafana-pdc-agent
    spec:
      containers:
      - name: grafana-pdc-agent
        env:
        - name: TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: grafana-pdc-agent
        - name: CLUSTER
          valueFrom:
            secretKeyRef:
              key: cluster
              name: grafana-pdc-agent
        - name: HOSTED_GRAFANA_ID
          valueFrom:
            secretKeyRef:
              key: hosted-grafana-id
              name: grafana-pdc-agent
        args:
        - -cluster
        - $(CLUSTER)
        - -token
        - $(TOKEN)
        - -gcloud-hosted-grafana-id
        - "$(HOSTED_GRAFANA_ID)"
        image: grafana/pdc-agent:latest
        imagePullPolicy: Always
        resources:
        {{- toYaml .Values.pdc.resources | nindent 10 }}
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          runAsNonRoot: true
          capabilities:
            drop:
              - all
      securityContext:
        runAsUser: 30000
        runAsGroup: 30000
        fsGroup: 30000
      {{- if .Values.pdc.nodeSelector }}
      nodeSelector:
      {{ toYaml .Values.pdc.nodeSelector | indent 8 }}
      {{- end }}
---
{{- end }}

{{- if .Values.grafanaMCP.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp-server
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ .Values.grafanaMCP.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: grafana-mcp-server
  template:
    metadata:
      labels:
        app: grafana-mcp-server
      annotations:
        k8s_grafana_com_scrape: "true"
        k8s_grafana_com_job: "grafana-mcp-server"
        k8s_grafana_com_metrics_path: "/metrics"
        k8s_grafana_com_metrics_portNumber: "8000"
    spec:
      containers:
        - name: grafana-mcp-server
          image: "{{ .Values.grafanaMCP.image }}:{{ .Values.grafanaMCP.imageTag }}"
          imagePullPolicy: IfNotPresent
          args:
            - -allowed-hosts={{ .Values.grafanaMCP.allowedHosts | default "*" }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: GRAFANA_URL
              value: {{ required "grafanaMCP.grafanaUrl is required when grafanaMCP.enabled=true" .Values.grafanaMCP.grafanaUrl | quote }}
            - name: GRAFANA_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: grafana-mcp-server
                  key: token
                  optional: true
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
{{- toYaml .Values.grafanaMCP.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop:
                - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: grafana-mcp-server
                topologyKey: kubernetes.io/hostname
{{- if .Values.grafanaMCP.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.grafanaMCP.nodeSelector | indent 8 }}
{{- end }}
---
{{- end }}

{{- if and .Values.grafanaMCP.enabled .Values.grafanaMCP.proxy.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp-proxy
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: {{ .Values.grafanaMCP.proxy.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: grafana-mcp-proxy
  template:
    metadata:
      labels:
        app: grafana-mcp-proxy
    spec:
      containers:
        - name: grafana-mcp-proxy
          image: "{{ .Values.grafanaProxy.image }}:{{ .Values.grafanaProxy.imageTag }}"
          ports:
            - name: proxy
              containerPort: 80
              protocol: TCP
          env:
            - name: DUPLO_AUTH_URL
              value: {{ required "global.duploAuthUrl is required when grafanaMCP.proxy.enabled=true" .Values.global.duploAuthUrl | quote }}
            - name: BACKEND_URL
              value: "http://grafana-mcp-server:8000"
            - name: CUSTOM_HEADER_ADD
              value: "proxy_buffering off;"
          readinessProbe:
            httpGet:
              path: /duplo_auth
              port: 80
              scheme: HTTP
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /duplo_auth
              port: 80
              scheme: HTTP
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
          resources:
{{- toYaml .Values.grafanaProxy.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 1
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: grafana-mcp-proxy
                topologyKey: kubernetes.io/hostname
{{- if .Values.grafanaMCP.proxy.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.grafanaMCP.proxy.nodeSelector | indent 8 }}
{{- end }}
---
{{- end }}

{{- if and .Values.grafanaMCP.enabled (not .Values.grafanaMCP.proxy.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-mcp-passthrough-config
  namespace: {{ $.Release.Namespace }}
data:
  default.conf: |
    server {
        listen 80;
        location /duplo_auth {
            return 200 "OK";
            add_header Content-Type text/plain;
        }
        location / {
            proxy_pass http://grafana-mcp-server:8000;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana-mcp-proxy
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana-mcp-proxy
  template:
    metadata:
      labels:
        app: grafana-mcp-proxy
    spec:
      containers:
        - name: grafana-mcp-proxy
          image: "nginx:alpine"
          ports:
            - name: proxy
              containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /duplo_auth
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /duplo_auth
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          resources:
            requests:
              cpu: "20m"
              memory: "32Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: nginx-config
          configMap:
            name: grafana-mcp-passthrough-config
{{- if .Values.grafanaMCP.proxy.nodeSelector }}
      nodeSelector:
{{ toYaml .Values.grafanaMCP.proxy.nodeSelector | indent 8 }}
{{- end }}
---
{{- end }}